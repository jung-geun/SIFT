# GitHub Actions CD — App Store Connect build uploads
#
# Triggers: version tags (v* or numeric SemVer tags) or manual dispatch.
#
# Required GitHub Actions secrets:
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_BASE64

name: Upload release builds to App Store Connect

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  deploy:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify package resolution integrity
        run: sh ci_scripts/ci_pre_xcodebuild.sh

      - name: Prepare App Store Connect signing
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>VQXGRP23X5</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Archive and upload iOS build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          AUTH_ARGS=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$API_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          )

          xcodebuild archive \
            -project ios/todo.xcodeproj \
            -scheme todo \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/todo-ios.xcarchive" \
            "${AUTH_ARGS[@]}" \
            CODE_SIGN_STYLE=Automatic

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/todo-ios.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            "${AUTH_ARGS[@]}"

      - name: Archive and upload Mac Catalyst build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          AUTH_ARGS=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$API_KEY_PATH"
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          )

          xcodebuild archive \
            -project ios/todo.xcodeproj \
            -scheme todo \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/todo-catalyst.xcarchive" \
            "${AUTH_ARGS[@]}" \
            CODE_SIGN_STYLE=Automatic

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/todo-catalyst.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/catalyst-export" \
            "${AUTH_ARGS[@]}"

      # ─── Remove temporary signing material ──────────────────────────

      - name: Clean up signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Clean up archives
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/todo-ios.xcarchive" "$RUNNER_TEMP/todo-catalyst.xcarchive" "$RUNNER_TEMP/ios-export" "$RUNNER_TEMP/catalyst-export"
