# GitHub Actions CI — Xcode 프로젝트 빌드 + Tier 1 파서 테스트
#
# ⚠️ 주의: 이 프로젝트는 SPM(Package.swift) 이 아닌 Xcode 프로젝트이므로
#           `swift build` / `swift test` 대신 `xcodebuild` 를 사용합니다.
#
# ⚠️ Xcode 버전 경고: deployment target = iOS 26.5, Xcode 26.5 빌드 필요.
#   GitHub 호스티드 러너(macos-15)에 Xcode 26.5 가 없으면 빌드가 실패할 수 있습니다.
#   러너에 Xcode 26.5 가 추가되는 시점에 자동으로 통과됩니다.
#
# FMSmokeTests의 기본 회귀 검사는 주입한 런타임으로 어댑터 계약을 검증합니다.
# 실제 Foundation Models 생성 품질·안전 정책 스모크는 별도 수동 실행 근거로 기록합니다.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Verify Package.resolved integrity
        run: sh ci_scripts/ci_pre_xcodebuild.sh

      - name: Build
        run: |
          xcodebuild build \
            -project ios/todo.xcodeproj \
            -scheme todo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild build \
            -project ios/todo.xcodeproj \
            -scheme todo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (deterministic unit suite)
        run: |
          xcodebuild test \
            -project ios/todo.xcodeproj \
            -scheme todo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:todoTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild test \
            -project ios/todo.xcodeproj \
            -scheme todo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:todoTests \
            CODE_SIGNING_ALLOWED=NO
