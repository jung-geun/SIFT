# GitHub Actions CI — Xcode 프로젝트 빌드 + Tier 1 파서 테스트
#
# ⚠️ 주의: 이 프로젝트는 SPM(Package.swift) 이 아닌 Xcode 프로젝트이므로
#           `swift build` / `swift test` 대신 `xcodebuild` 를 사용합니다.
#
# 앱과 테스트의 최소 SDK를 지원하는 최신 Xcode와 Simulator가 필요합니다.
# 빌드 출력을 formatter에 파이프하지 않아 실패 종료 코드를 그대로 보존합니다.
#
# FMSmokeTests의 기본 회귀 검사는 주입한 런타임으로 어댑터 계약을 검증합니다.
# 실제 Foundation Models 생성 품질·안전 정책 스모크는 별도 수동 실행 근거로 기록합니다.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Select stable Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify Package.resolved integrity
        run: sh ci_scripts/ci_pre_xcodebuild.sh

      - name: Build and test deterministic unit suite
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; runtimes=sorted((r for r in d if ".iOS-" in r),key=lambda r:tuple(map(int,r.rsplit("iOS-",1)[1].split("-"))),reverse=True); print(next(v["udid"] for r in runtimes for v in d[r] if v["name"].startswith("iPhone") and v["isAvailable"]))')
          xcodebuild test \
            -project ios/todo.xcodeproj \
            -scheme todo-QA \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:todoTests \
            -resultBundlePath "$RUNNER_TEMP/unit-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/unit-tests.xcresult
          if-no-files-found: warn
