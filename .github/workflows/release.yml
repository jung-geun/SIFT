name: Publish curated release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact SemVer tag with authored release notes
        required: true
        type: string

permissions: {}

concurrency:
  group: curated-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # Execute trusted publication tooling and notes from main, not arbitrary tag code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate notes and publish one release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py publish --tag "$REQUESTED_TAG"
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN-created releases do NOT trigger release-event workflows.
  # An explicit reusable-workflow call makes publication + public refresh one run.
  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      required_tag: ${{ needs.publish.outputs.tag }}
