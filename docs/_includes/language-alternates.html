{% assign alternate_page_path = site.data.site_i18n.pages[current_page_key] %}
{% if alternate_page_path %}
{% for language in site.data.site_i18n.languages %}
<link rel="alternate" hreflang="{{ language.code }}" href="{{ language.prefix | append: alternate_page_path | absolute_url }}">
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ alternate_page_path | absolute_url }}">
{% endif %}
